<title>社會任務</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* 版面：一台深色的復古遊戲機——任務大廳選單元，任務畫面上方是像素場景和機器人嚮導，下面是對話框和選項。故意只做一種夜色配色。 */
:root{
  --bg:#141a3a; --bg2:#0e1330; --panel:#20285a; --panel2:#2a3370; --line:#0b0e22;
  --text:#f4f1ff; --dim:#a9a6d6; --gold:#ffcf3f; --cyan:#3ce0ff; --pink:#ff5fa2; --green:#3ccf6e; --red:#ff5a5a;
  --u1:#ff6b6b; --u2:#ffb84d; --u3:#4dd2ff; --u4:#6be07a; --u5:#c48bff;
  --f:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --px:"Press Start 2P",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f);
  background-image:radial-gradient(circle at 20% 10%,rgba(60,224,255,.08),transparent 40%),radial-gradient(circle at 85% 80%,rgba(255,95,162,.08),transparent 40%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* ---------- 上方 bar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{margin:0;font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px;text-shadow:3px 3px 0 var(--line)}
.logo .px{font-family:var(--px);font-size:10px;color:var(--gold)}
.me{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);padding:4px 10px}
.me .lv{font-family:var(--px);font-size:11px;color:var(--gold)}
.me .ttl{font-weight:900;font-size:14px}
.xpbar{width:90px;height:10px;background:var(--bg2);border:2px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green))}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-weight:900;font-size:14px;background:var(--panel2);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);padding:3px 10px}
.chip:active{transform:translateY(3px);box-shadow:none}
.chip[aria-pressed="false"]{opacity:.55}

/* ---------- 任務大廳 ---------- */
.hero{position:relative;background:var(--panel);border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.35);overflow:hidden}
.hero canvas{display:block;width:100%;height:80px;image-rendering:pixelated}
.hero .txt{display:flex;flex-direction:column;gap:2px;padding:10px 16px 8px}
.hero h2{margin:0;font-size:clamp(22px,4vw,34px);font-weight:900;text-shadow:3px 3px 0 var(--line)}
.hero p{margin:0;font-weight:700;color:var(--gold);text-shadow:2px 2px 0 var(--line);font-size:14px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}
.unit{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:4px solid var(--line);box-shadow:0 6px 0 var(--line);padding:12px 14px 14px;border-top:8px solid var(--c)}
.unit:hover{background:var(--panel2)}
.unit:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.unit .top{display:flex;align-items:center;gap:10px}
.unit canvas{width:48px;height:48px;image-rendering:pixelated;flex:none}
.unit .no{font-family:var(--px);font-size:10px;color:var(--c)}
.unit h3{margin:2px 0 0;font-size:18px;line-height:1.3;font-weight:900;text-wrap:balance}
.unit ul{margin:0;padding-left:1.1em;color:var(--dim);font-size:13px;line-height:1.6}
.unit .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;font-weight:700;font-size:13px}
.stars{font-size:18px;letter-spacing:1px;color:var(--gold)}
.stars .off{color:#4a4f86}
.unit .go{font-family:var(--px);font-size:10px;background:var(--c);color:var(--line);padding:6px 8px;border:2px solid var(--line)}
.tipline{color:var(--dim);font-size:13px;text-align:center;margin:0}

/* ---------- 任務畫面 ---------- */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hud .uname{font-weight:900;font-size:16px;color:var(--c)}
.dots{display:flex;gap:4px;flex:1;min-width:120px}
.dots i{flex:1;height:10px;background:var(--bg2);border:2px solid var(--line)}
.dots i.ok{background:var(--green)}.dots i.no{background:var(--red)}.dots i.now{background:var(--gold)}
.combo{font-family:var(--px);font-size:11px;color:var(--pink);min-width:84px;text-align:right}
.score{font-family:var(--px);font-size:11px;color:var(--gold)}
.scene{position:relative;border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.35);background:var(--bg2)}
.scene canvas{display:block;width:100%;height:72px;image-rendering:pixelated}
.scene.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.float{position:absolute;font-family:var(--px);font-size:14px;color:var(--gold);text-shadow:2px 2px 0 var(--line);pointer-events:none;animation:up 1.1s forwards}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.bubble{position:relative;background:var(--text);color:var(--line);border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.35);padding:12px 16px}
.bubble::before{content:"";position:absolute;left:34px;top:-16px;border:8px solid transparent;border-bottom-color:var(--line)}
.bubble .tag{display:inline-block;font-size:12px;font-weight:900;background:var(--c);color:var(--line);border:2px solid var(--line);padding:0 8px;margin-bottom:6px}
.bubble .kind{font-family:var(--px);font-size:9px;color:#6a5a9a;margin-left:6px}
.bubble .q{font-size:clamp(18px,2.6vw,22px);font-weight:900;line-height:1.55;margin:0;text-wrap:pretty}
.bubble .q em{font-style:normal;color:#d0204a;text-decoration:underline}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);padding:10px 12px;font-size:17px;font-weight:700;line-height:1.4;min-height:56px}
.opt .k{flex:none;font-family:var(--px);font-size:11px;width:26px;height:26px;display:grid;place-items:center;background:var(--bg2);color:var(--c);border:2px solid var(--line)}
.opt:hover:not(:disabled){background:var(--panel2)}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:#1f6a3e;border-color:var(--green)}
.opt.no{background:#6a1f2e;border-color:var(--red)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.45}
.tf{grid-template-columns:repeat(2,minmax(0,1fr))}
.tf .opt{justify-content:center;font-size:22px;font-weight:900;min-height:72px}
.order-pool,.order-line{display:flex;flex-wrap:wrap;gap:8px}
.order-line{min-height:56px;background:var(--bg2);border:3px dashed #4a4f86;padding:8px}
.order-line .ph{color:var(--dim);font-size:14px;align-self:center}
.chipq{background:var(--panel);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);padding:8px 12px;font-weight:700;font-size:16px}
.chipq .n{font-family:var(--px);font-size:10px;color:var(--gold);margin-right:6px}
.chipq.ok{border-color:var(--green)}.chipq.no{border-color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.btn{font-weight:900;font-size:17px;background:var(--gold);color:var(--line);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);padding:8px 18px}
.btn.alt{background:var(--panel2);color:var(--text)}
.btn.hint{background:var(--cyan)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.fb{background:var(--panel);border:3px solid var(--line);border-left:10px solid var(--green);padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.fb.bad{border-left-color:var(--red)}
.fb .h{font-weight:900;font-size:18px}
.fb .x{color:var(--dim);font-size:15px;line-height:1.7}
.fb .x b{color:var(--gold)}
.newcard{font-family:var(--px);font-size:10px;color:var(--pink)}

/* ---------- 結算 ---------- */
.result{background:var(--panel);border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.35);padding:20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.rank{font-family:var(--px);font-size:64px;color:var(--gold);text-shadow:5px 5px 0 var(--line);line-height:1}
.result .stars{font-size:40px}
.result .sum{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-weight:700}
.result .sum b{font-family:var(--px);font-size:13px;color:var(--cyan)}
.lvup{font-family:var(--px);font-size:13px;color:var(--pink);animation:blink .6s steps(2) 6}
@keyframes blink{50%{opacity:0}}
.gotcards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.mixbtn{font-weight:900;font-size:17px;text-align:left;background:linear-gradient(90deg,var(--u1),var(--u2));color:var(--line);border:4px solid var(--line);box-shadow:0 6px 0 var(--line);padding:12px 16px}
.mixbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.unit .sub{margin:0;color:var(--dim);font-size:14px}
.fb .ref{font-size:14px;color:var(--dim);line-height:1.7}
.fb .ref b{color:var(--cyan)}
.fb .x .lab{display:inline-block;font-size:12px;font-weight:900;background:var(--gold);color:var(--line);padding:0 6px;margin-right:6px}
.review{background:var(--bg2);border:3px solid var(--line);padding:10px 14px;text-align:left;font-size:14px;line-height:1.8;width:100%;max-width:620px;color:var(--dim)}
.review b{color:var(--gold)}
.pets{display:flex;align-items:center;gap:6px}
.petrow{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:2px 0 5px}
.petrow::-webkit-scrollbar{display:none}
.petrow .pet{flex:none;scroll-snap-align:start}
.parr{flex:none;width:30px;align-self:stretch;margin-bottom:3px;background:var(--panel);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);color:var(--gold);font-size:13px;font-weight:900}
.parr[hidden]{display:block!important;visibility:hidden}
.parr:active{transform:translateY(3px);box-shadow:none}
@media (max-width:520px){.pets{flex-wrap:wrap}.pets .lab{flex-basis:100%}}
.pets .lab{font-weight:900;color:var(--gold);margin-right:4px}
.pet{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);padding:4px 6px;font-size:12px;font-weight:700;min-width:52px}
.pet canvas{width:36px;height:30px;image-rendering:pixelated}
.pet.on{background:var(--gold);color:var(--line)}
.pet:active{transform:translateY(3px);box-shadow:none}
.confetti{position:fixed;inset:0;z-index:40;pointer-events:none}
.lbwin,.lbbox{width:min(480px,100%);background:var(--panel);border:4px solid var(--line);box-shadow:8px 8px 0 rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px;padding-bottom:14px}
.lbwin .head,.lbbox .head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--gold);color:var(--line);font-weight:900;font-size:18px}
.lbwin ul{margin:0;padding:0 18px;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:16px}
.lbwin li b{color:var(--gold)}
.lbwin .rk{margin-left:8px;font-family:var(--px);font-size:10px;color:var(--pink)}
.lbwin .nm{display:flex;flex-direction:column;gap:6px;padding:0 18px;font-weight:900}
.lbwin input{font:inherit;font-size:20px;font-weight:700;padding:8px 10px;border:3px solid var(--line);background:var(--text);color:var(--line)}
.lbwin .me2{display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--dim);font-size:14px}
.lbwin .me2 canvas,.lblist canvas{width:36px;height:30px;image-rendering:pixelated;flex:none}
.lbwin .err{margin:0 18px;color:var(--red);font-weight:700}
.lbwin .row,.lbbox .row{padding:0 14px}
.lbbox .x{background:none;border:0;font-size:18px;font-weight:900;color:var(--line)}
.lbbox .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px}
@media (max-width:520px){.lbbox .tabs{grid-template-columns:repeat(2,1fr)}}
.lbbox .tab{flex:1;min-width:0;font-weight:900;font-size:14px;background:var(--bg2);border:3px solid var(--line);padding:6px 4px;color:var(--dim)}
.lbbox .tab.on{background:var(--cyan);color:var(--line)}
.lbnote{padding:0 14px;color:var(--dim);font-size:13px}
.lbmsg{padding:10px 14px;margin:0;color:var(--dim);text-align:center}
.lblist{margin:0;padding:0 12px;list-style:none;display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto}
.lblist li{display:flex;align-items:center;gap:10px;background:var(--bg2);border:2px solid var(--line);padding:4px 10px;font-weight:700}
.lblist li.me{background:#3a3170;border-color:var(--gold)}
.lblist .no{width:28px;text-align:center;font-family:var(--px);font-size:11px;color:var(--gold)}
.lblist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lblist .v{font-family:var(--px);font-size:11px;color:var(--cyan);text-align:right;flex:none}
.lblist .v small{display:block;font-size:9px;color:var(--dim);margin-top:2px}
.lbupd{padding:0 14px;color:var(--cyan);font-size:13px;font-weight:700}
/* ---------- 知識卡圖鑑 ---------- */
.dex h3{margin:6px 0;font-size:17px;color:var(--c)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.card{background:var(--panel);border:3px solid var(--line);border-top:6px solid var(--c);padding:10px;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.6;color:var(--dim)}
.card canvas{width:36px;height:36px;image-rendering:pixelated;flex:none}
.card b{display:block;color:var(--text);font-size:14px}
.card.lock{opacity:.5}
.card.lock canvas{filter:brightness(0)}

/* ---------- 提示動畫 ---------- */
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,25,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.hintbox{width:min(560px,100%);background:var(--panel);border:4px solid var(--line);box-shadow:8px 8px 0 rgba(0,0,0,.5);display:flex;flex-direction:column}
.hintbox .head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--cyan);color:var(--line);font-weight:900}
.hintbox .head .px{font-family:var(--px);font-size:10px}
.hintbox canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:var(--bg2);border-block:4px solid var(--line)}
.hintbox .cap{min-height:4.8em;padding:12px 16px;font-size:17px;font-weight:700;line-height:1.7}
.hintbox .row{padding:0 12px 12px;justify-content:space-between}
.hintbox .pg{font-family:var(--px);font-size:10px;color:var(--dim)}
.help{background:var(--panel);border:4px solid var(--line);padding:16px 20px;max-width:560px;line-height:1.8;font-size:15px}
.help h3{margin:0 0 6px;color:var(--gold)}
.help ul{margin:0 0 10px;padding-left:1.2em}

@media (max-width:640px){
  .opts{grid-template-columns:minmax(0,1fr)}
  .tf{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opt{font-size:16px;min-height:50px}
  .xpbar{width:60px}
  .logo{font-size:17px}
  .hero p{font-size:12px}
  .rank{font-size:48px}
}
@media (prefers-reduced-motion:reduce){.float,.lvup,.scene.shake{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <h1 class="logo"><span class="px">QUEST</span>社會任務</h1>
    <div class="me" id="me"></div>
    <div class="btns">
      <button class="chip" id="btnHome">🏠 主畫面</button>
      <button class="chip" id="btnRank">🏆 排行榜</button><button class="chip" id="btnDex">📚 知識卡</button>
      <button class="chip" id="btnSnd" aria-pressed="true">🔊 音效</button>
      <button class="chip" id="btnHelp">❓ 說明</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="modal" id="modal" hidden></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const INK = '#0b0e22';

// ---------- 聲音 ----------
let AC = null, muted = false;
function audio(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e){ return null; } } if (AC.state === 'suspended') AC.resume(); return AC; }
function beep(f, d, type = 'square', v = .05, when = 0){
  if (muted) return; const a = audio(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
}
const SFX = {
  blip: () => beep(880, .05, 'square', .04),
  ok:   () => [659, 784, 1047].forEach((f, i) => beep(f, .1, 'square', .05, i * .07)),
  combo:() => [784, 988, 1175, 1568].forEach((f, i) => beep(f, .09, 'square', .05, i * .06)),
  no:   () => { beep(196, .14, 'sawtooth', .05); beep(147, .22, 'sawtooth', .05, .12); },
  win:  () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => beep(f, i === 6 ? .5 : .12, 'square', .05, i * .12)),
  page: () => beep(1200, .03, 'triangle', .04)
};

// ---------- 像素圖：把 emoji 縮成小像素圖，加一圈深色描邊 ----------
const SPR = {};
function sprite(e, n = 20){
  const key = e + n; if (SPR[key]) return SPR[key];
  const big = document.createElement('canvas'); big.width = big.height = 80;
  const bg = big.getContext('2d');
  bg.font = '50px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'; bg.textAlign = 'center'; bg.textBaseline = 'middle';
  bg.fillText(e, 40, 43);
  const bd = bg.getImageData(0, 0, 80, 80).data;
  let x0 = 80, y0 = 80, x1 = -1, y1 = -1;
  for (let y = 0; y < 80; y++) for (let x = 0; x < 80; x++) if (bd[(y * 80 + x) * 4 + 3] > 40){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  if (x1 >= 0){ const w = x1 - x0 + 1, h = y1 - y0 + 1, sc = Math.min((n - 2) / w, (n - 2) / h); g.drawImage(big, x0, y0, w, h, 1 + (n - 2 - w * sc) / 2, 1 + (n - 2 - h * sc) / 2, w * sc, h * sc); }
  const id = g.getImageData(0, 0, n, n), d = id.data;

  g.fillStyle = INK; edge.forEach(i => g.fillRect(i % n, Math.floor(i / n), 1, 1));
  return (SPR[key] = c);
}

  C('b1', '為什麼說憲法是國家的「根本大法」？', ['它規定國家組織與人民權利義務，其他法律不能違反它', '它是最新的法律', '它只有總統能看', '它是最短的法律'], '憲法規定國家的基本架構和人民的基本權利，地位最高，一般法律或命令如果違反憲法就無效。'),
  C('b1', '如果一條法律的內容和憲法互相衝突，會怎麼樣？', ['那條法律無效', '那條法律比較優先', '兩者都繼續有效', '由總統決定要用哪一個'], '憲法的效力最高，法律牴觸憲法者無效；是否違憲由憲法法庭判斷。'),
  C('b1', '中華民國憲法中規定「人民之權利義務」的是哪一章？', ['第二章', '第一章', '第五章', '第十章'], '憲法第二章（第 7～24 條）列出人民的各項權利與義務。'),
  T('b1', '憲法一旦制定就永遠不能修改。', false, '憲法可以依照嚴格的程序修改，臺灣自 1991 年起就曾多次修憲，以符合時代需要。'),
  C('b1', '透過修憲，下列哪一項規定被寫進憲法？', ['總統、副總統由人民直接選舉', '恢復戒嚴', '取消人民的選舉權', '禁止宗教信仰'], '1994 年修憲規定總統由人民直接選舉，1996 年首度實施。'),
  C('b1', '憲法增修條文規定國家應保障原住民族的什麼？', ['地位、政治參與及教育文化等權益', '只能住在山上', '不能參加選舉', '必須改說華語'], '憲法增修條文規定，國家應依民族意願，保障原住民族的地位及政治參與，並扶助其教育文化、經濟、醫療等發展。'),
  C('b1', '憲法保障人民的權利，主要是用來防止什麼？', ['國家權力被濫用、侵害人民', '人民太自由', '外國人來觀光', '物價上漲'], '憲法限制政府權力，讓人民的基本權利不被國家任意侵害。'),
  T('b1', '人民的權利寫在憲法裡，代表政府有責任保障這些權利。', true, '憲法明文保障的權利，政府必須尊重並採取措施保護，不能任意剝奪。'),
  C('b1', '我國現行的憲法是在哪一年開始施行的？', ['1947 年', '1912 年', '1987 年', '2000 年'], '中華民國憲法於 1946 年制定，1947 年 12 月 25 日開始施行，這天後來稱為行憲紀念日。'),
  // ===== b2 平等權 =====
  C('b2', '憲法規定人民「無分男女、宗教、種族、階級、黨派，在法律上一律平等」，這是哪一種權利？', ['平等權', '自由權', '參政權', '受益權'], '這是憲法第 7 條規定的平等權：每個人在法律之前都應受到同等對待。'),
  C('b2', '下列哪一個情況違反了平等權？', ['公司規定女性員工結婚就必須離職', '公車上設置博愛座', '為視障者設置導盲磚', '考試時讓每個人寫同一份試卷'], '因為性別、婚姻而給予不利的對待，沒有正當理由，是性別歧視，違反平等權。'),
  C('b2', '為了保障身心障礙者的工作權，法律規定一定規模以上的機關、企業要怎麼做？', ['依比例僱用身心障礙者', '不能僱用身心障礙者', '只能僱用年輕人', '只能僱用男性'], '《身心障礙者權益保障法》規定「定額進用」：達到一定員工人數的公私機構，要僱用一定比例的身心障礙者。'),
  T('b2', '為了照顧弱勢而給予合理的特別待遇，例如身障專用停車位，並不違反平等權。', true, '平等不是「一模一樣」，而是讓每個人都有實質的公平機會；合理的差別待遇是為了達到真正的平等。'),
  C('b2', '公共建築設置無障礙坡道和電梯，主要是為了什麼？', ['讓行動不便的人也能平等使用公共設施', '讓建築比較漂亮', '增加工程費用', '只給工作人員使用'], '無障礙設施讓輪椅使用者、長輩和推嬰兒車的人都能方便進出，是落實平等權的做法。'),
  C('b2', '參加國家考試時，下列哪一種規定最符合平等權？', ['不論性別、宗教、黨派，都依同樣標準評分', '某黨派的考生加分', '男性考生優先錄取', '信仰某宗教的考生不能報名'], '國家考試應以同一標準公平選才，不能因為身分背景而有差別對待。'),
  T('b2', '平等權的意思是，每個人得到的東西都必須一模一樣。', false, '平等權重視「實質平等」：相同的情況相同對待、不同的情況依合理理由差別對待，並不是每個人都拿一樣多。'),
  C('b2', '下列哪一句話帶有歧視，違反平等的精神？', ['「他是原住民，一定不會讀書。」', '「大家排隊依序進場。」', '「請讓座給孕婦。」', '「每個人都有發言的機會。」'], '用族群身分斷定一個人的能力，是刻板印象和歧視，違反平等的精神。'),
  C('b2', '學校為聽障學生提供手語翻譯，這是在落實哪一種權利？', ['平等權與受教育的權利', '服兵役的義務', '納稅的義務', '罷免權'], '提供手語翻譯，讓聽障學生和其他人一樣能學習，是保障平等權與受教育權的具體做法。'),
  C('b2', '「黨派」平等是指什麼？', ['不論支持哪一個政黨，在法律上都受同樣保障', '只有執政黨的人能當官', '不能加入政黨', '每個人都必須加入政黨'], '不論支持哪一個政黨，或是不支持任何政黨，在法律上都應受到同樣的保障與對待。'),
  // ===== b3 自由權與它的界線 =====
  C('b3', '下列哪一項屬於憲法保障的自由權？', ['自由選擇居住的地方', '依法納稅', '服兵役', '接受國民教育'], '居住及遷徙自由是自由權的一種；納稅、服兵役、受國民教育則是義務。'),
  C('b3', '警察不能沒有法律依據就隨便抓人、關人，這是在保障哪一種自由？', ['人身自由', '宗教自由', '通訊自由', '集會自由'], '憲法第 8 條保障人身自由：非經法定程序，不得逮捕、拘禁、審問、處罰。'),
  C('b3', '別人的信件、私訊不能被任意偷看，這是在保障哪一種自由？', ['秘密通訊自由', '居住自由', '宗教自由', '遷徙自由'], '憲法第 12 條保障秘密通訊自由，未經合法程序，任何人都不能任意拆看或監聽他人的通訊。'),
  C('b3', '下列哪一種行為，已經超出言論自由的界線？', ['在網路上散布不實謠言，毀損別人名譽', '在網路上說某部電影很無聊', '向政府提出改善建議', '寫文章批評政策'], '言論自由保障表達意見和評論，但散布不實內容、損害他人名譽，就侵犯了別人的權利，可能違法。'),
  T('b3', '自由權沒有任何限制，想做什麼都可以。', false, '自由以不侵害他人為界線；憲法第 23 條也規定，為了防止妨礙他人自由、維持社會秩序或增進公共利益，可以用法律限制自由。'),
  C('b3', '依照憲法，政府如果要限制人民的自由，必須符合哪一個條件？', ['要有法律依據，而且只能在必要的範圍內', '總統說了就算', '隨時都可以限制', '只要有人抱怨就能限制'], '限制人民自由必須以法律規定，且不能超過必要的程度，這就是「法律保留」和「比例原則」。'),
  C('b3', '依法申請、和平進行的遊行活動，是在行使哪一種自由？', ['集會自由', '通訊自由', '宗教自由', '居住自由'], '集會遊行自由讓人民可以聚集起來公開表達訴求，但要和平進行並遵守相關法律規定。'),
  C('b3', '一個人可以信仰任何宗教，也可以不信仰宗教，這是什麼自由？', ['宗教信仰自由', '集會自由', '居住自由', '通訊自由'], '憲法第 13 條保障宗教信仰自由，國家不能強迫人民信仰或不信仰某種宗教。'),
  C('b3', '深夜在公寓大聲唱歌吵到鄰居睡覺，這說明了自由的什麼特性？', ['自由不能妨害他人的權利', '自由完全沒有限制', '只有白天才有自由', '唱歌一定違法'], '每個人的自由都有界線，不能因為自己的自由，影響別人休息、安寧的權利。'),
  T('b3', '在網路上表達「我覺得這家店的餐點太鹹了」，屬於言論自由保障的範圍。', true, '對商品或服務提出真實的個人感受與評價，是言論自由；但若捏造事實或惡意辱罵，就可能違法。'),
  // ===== b4 參政權 =====
  C('b4', '下列哪一組權利都屬於參政權？', ['選舉、罷免、創制、複決', '納稅、服兵役、受教育', '言論、宗教、集會', '請願、訴願、訴訟'], '憲法第 17 條規定人民有選舉、罷免、創制、複決四權，加上應考試、服公職，都是參政權。'),
  C('b4', '依照憲法規定，年滿幾歲才有選舉權？', ['20 歲', '18 歲', '16 歲', '25 歲'], '憲法第 130 條規定年滿 20 歲有選舉權；2022 年曾舉行將門檻降為 18 歲的修憲複決，但沒有通過。'),
  C('b4', '依照公民投票法，年滿幾歲就可以參加公民投票？', ['18 歲', '20 歲', '16 歲', '23 歲'], '公民投票法規定，年滿 18 歲的國民就有公民投票權。'),
  T('b4', '一位 19 歲的年輕人，可以參加公民投票，但還不能參加總統選舉投票。', true, '公民投票權 18 歲、選舉權 20 歲，所以 19 歲可以投公投，不能投總統選舉。'),
  C('b4', '居民覺得選出的議員嚴重失職，依法發起投票把他解職，這是在行使哪一種權利？', ['罷免', '創制', '複決', '請願'], '罷免是人民依法投票，讓不適任的民選公職人員提前去職。'),
  C('b4', '人民直接提出法律或重大政策的構想，交付投票決定，這比較接近哪一種權利？', ['創制', '罷免', '訴願', '服兵役'], '創制是人民自己提出法律或政策原則；複決則是人民對已有的法律或政策投票決定要不要接受。'),
  C('b4', '參加國家考試、成為公務人員為大家服務，屬於哪一種權利？', ['應考試、服公職的權利（參政權）', '平等權', '受益權', '自由權'], '應考試、服公職讓人民透過考試進入政府服務，是參與國家事務的一種方式，屬於參政權。'),
  C('b4', '下列哪一個職位，是由人民選舉產生的？', ['縣市長', '法官', '公立學校老師', '警察局長'], '縣市長由居民直接選出；法官、老師、警察大多透過考試或甄選任用。'),
  T('b4', '參政權只能透過投票行使，參加考試當公務員不算參政。', false, '參政權除了選舉、罷免、創制、複決，還包括應考試、服公職。'),
  C('b4', '民意代表的主要工作是什麼？', ['反映民意、監督政府、審議法律和預算', '在法院審判案件', '在學校教書', '管理醫院'], '立法委員、縣市議員等民意代表代替人民發聲，監督政府施政，並審議法律、預算。'),
  // ===== b5 受益權 =====
  C('b5', '權益受到政府機關不當處分時，人民可以向上級機關提出什麼來救濟？', ['訴願', '罷免', '服兵役', '納稅'], '訴願是人民不服行政機關的處分時，向上級機關請求撤銷或變更的救濟方式。'),
  C('b5', '和別人發生糾紛、無法私下解決時，人民可以向法院提出什麼？', ['訴訟', '請願', '罷免', '創制'], '訴訟是請法院依法審判，判斷誰有理、誰該負責。'),
  C('b5', '人民向政府表達希望改善某件事的意見，例如請求增設公園，這屬於什麼？', ['請願', '訴訟', '罷免', '服兵役'], '請願是人民對國家政策或公共利益，向政府機關表達希望與請求。'),
  C('b5', '請願、訴願、訴訟，屬於哪一種權利？', ['受益權', '參政權', '平等權', '自由權'], '這些權利讓人民能「請求國家提供保障」，屬於受益權。'),
  T('b5', '受教育、工作、生存，都是人民可以要求國家保障的權利。', true, '憲法保障人民的生存權、工作權、受教育權，國家應採取措施讓人民享有這些權利。'),
  C('b5', '政府提供低收入戶生活補助，主要是在保障人民的什麼權利？', ['生存權', '集會自由', '罷免權', '秘密通訊自由'], '社會救助讓經濟困難的人維持基本生活，是保障生存權的做法。'),
  C('b5', '「受益權」的特色是什麼？', ['人民可以積極要求國家提供服務或保障', '人民不能向國家要求任何事', '只有官員能享有', '和法律無關'], '受益權是人民請求國家「做些什麼」來保障自己，例如提供教育、救濟、審判。'),
  T('b5', '人民對法院的判決不服，就只能接受，沒有任何救濟的方法。', false, '對第一審判決不服，可以依法上訴，請上級法院重新審理。'),
  // ===== b6 人民的三大義務 =====
  C('b6', '憲法規定人民有哪三項義務？', ['納稅、服兵役、受國民教育', '投票、納稅、工作', '服兵役、旅遊、讀書', '納稅、運動、參加社團'], '憲法第 19、20、21 條分別規定人民有納稅、服兵役、受國民教育的義務。'),
  C('b6', '人民為什麼要納稅？', ['政府需要經費提供公共建設和服務', '讓人民變窮', '讓官員自由花用', '沒有原因'], '道路、學校、醫院、國防、治安都需要經費，稅收是政府最主要的財源。'),
  C('b6', '買東西時店家依法開立統一發票，和哪一項義務最有關？', ['納稅', '服兵役', '受國民教育', '投票'], '統一發票記錄交易金額，讓營業稅能被正確計算，幫助落實納稅義務。'),
  C('b6', '目前依法律規定，誰需要服兵役？', ['年滿 18 歲的男性國民', '所有女性', '只有警察', '只有 30 歲以上的人'], '依兵役法，男性國民年滿 18 歲起有服兵役的義務。'),
  C('b6', '臺灣從 2024 年起，義務役的役期恢復為多久？', ['1 年', '4 個月', '2 年', '3 年'], '政府考量國防需要，自 2024 年起恢復一年制義務役，適用 2005 年以後出生的役男。'),
  C('b6', '我國國民教育的年齡範圍是幾歲？', ['6 到 15 歲', '3 到 6 歲', '15 到 18 歲', '18 到 22 歲'], '國民教育是國小 6 年加上國中 3 年，學齡大約是 6 到 15 歲。'),
  T('b6', '受國民教育既是人民的權利，也是人民的義務。', true, '國家必須提供國民教育（權利），學齡兒童也必須接受（義務），家長沒讓孩子入學可能會被處罰。'),
  T('b6', '十二年國教實施後，讀高中職也變成強迫性的義務教育。', false, '十二年國教的後三年（高中職）以自願入學為原則，不具強迫性；義務教育仍是國中小九年。'),
  C('b6', '政府用稅收做的事，下列哪一項最合理？', ['興建學校、醫院與道路', '幫官員買私人汽車', '把錢藏起來不用', '只給某一個人使用'], '稅金來自全體人民，應該用在公共建設與公共服務上，讓大家受益。'),
  C('b6', '如果每個人都逃漏稅，最可能出現什麼後果？', ['政府缺乏經費，公共服務變差', '道路會變得更好', '學校會增加', '物價一定下降'], '政府收入不足，就沒有錢維護道路、辦教育、照顧弱勢，最後全體人民都會受害。'),
  // ===== c1 主權在民與選舉 =====
  C('c1', '在民主國家，國家的權力最終來自哪裡？', ['全體人民', '總統一個人', '軍隊', '外國政府'], '「主權在民」：國家權力來自人民，政府只是受人民委託管理公共事務。'),
  C('c1', '民主國家為什麼要「定期」舉行選舉？', ['讓人民可以定期檢驗、更換執政者', '讓政府可以多放假', '因為選舉很好玩', '讓候選人賺錢'], '定期選舉讓執政者必須對人民負責，表現不好就可能在下次選舉被換掉。'),
  C('c1', '候選人舉辦政見發表會，主要目的是什麼？', ['讓選民了解他的政策和理念，以便比較選擇', '表演才藝', '販賣商品', '宣布選舉結果'], '政見發表會讓選民比較各候選人的政策，做出理性的投票選擇。'),

  C('d2', '下列哪一種做法，最符合現在教育重視「適性發展」的精神？', ['讓學生依興趣選修課程、參加社團', '所有人只能讀同樣的科目', '只看考試成績', '禁止學生發表意見'], '適性發展是讓每個學生依自己的興趣和能力學習，發揮不同的潛能。'),

  C('d2', '早期學校重視紀律與升學，可能帶來什麼問題？', ['學生的個人興趣與發展受到限制', '學生太自由', '學生考試太少', '學校太多社團'], '過度重視考試與統一規範，可能壓縮學生探索興趣和發展特長的空間。'),
  C('d2', '學校推動「彈性學習課程」，主要目的是什麼？', ['讓學生依需求和興趣進行多元學習', '讓學生放假', '增加考試次數', '取消所有課程'], '彈性學習課程讓學校和學生有空間發展特色課程、自主學習。'),

  C('d3', '由父母和未婚子女組成的家庭，稱為什麼？', ['小家庭（核心家庭）', '三代同堂家庭', '單人家庭', '隔代教養家庭'], '小家庭又稱核心家庭，由父母與未婚子女組成，是工商業社會常見的家庭型態。'),
  C('d3', '由祖父母照顧孫子女、父母不住在一起的家庭，稱為什麼？', ['隔代教養家庭', '核心家庭', '夫妻家庭', '單人家庭'], '父母可能因工作在外地等原因，由祖父母負責照顧孫子女，就是隔代教養家庭。'),
  C('d3', '工商業發展後，小家庭越來越普遍，主要原因是什麼？', ['年輕人到都市工作，離開原本的大家庭', '法律規定只能住三個人', '房子越蓋越大', '大家都搬到鄉下'], '工作機會集中在都市，年輕人離鄉工作、成家，家庭規模就變小了。'),

  C('d3', '只有夫妻兩人、沒有和子女同住的家庭，稱為什麼？', ['夫妻家庭', '核心家庭', '隔代教養家庭', '單親家庭'], '夫妻家庭包括沒有生育的夫妻，或子女已離家的夫妻。'),
  T('d3', '家庭型態越來越多元，代表社會越來越能包容不同的生活方式。', true, '不同的家庭型態都可能是幸福的，社會越開放，越能尊重每個人的選擇。'),
  C('d3', '下列哪一種想法，最能尊重多元的家庭型態？', ['每一種家庭都有它的樣子，都值得尊重', '只有三代同堂才是好家庭', '單親家庭一定比較不好', '沒有孩子的家庭不算家庭'], '家庭的價值在於成員彼此的照顧與關愛，而不在於人數或組成方式。'),
  // ===== d4 少子化與高齡化 =====

  C('d4', '少子化最可能直接造成下列哪一種影響？', ['學校招生不足、減班甚至停辦', '教室不夠用', '老年人口減少', '學生越來越多'], '孩子變少，學校招不到學生，部分學校只好減班、合併或停辦。'),
  C('d4', '「高齡化」是指什麼？', ['65 歲以上人口占總人口的比例越來越高', '大家越來越晚起床', '大樓越蓋越高', '老人越來越年輕'], '醫療進步、壽命延長，加上出生人數減少，讓老年人口比例不斷上升。'),
  C('d4', '當 65 歲以上人口超過總人口的 20%，稱為什麼社會？', ['超高齡社會', '高齡化社會', '年輕社會', '少子社會'], '老年人口比例超過 7% 是高齡化社會、14% 是高齡社會、20% 是超高齡社會；臺灣在 2025 年進入超高齡社會。'),

  C('d4', '政府提供育兒津貼、增設公共托育，主要想改善哪一個問題？', ['少子化', '高齡化', '交通擁擠', '空氣汙染'], '減輕養育孩子的經濟與照顧負擔，希望提高大家的生育意願。'),

  T('d4', '高齡化的主要原因之一是醫療進步，人們的平均壽命延長了。', true, '醫療和公共衛生進步，讓人活得更久，老年人口自然增加。'),

  C('d5', '「子承父業」是什麼意思？', ['子女繼承父母的事業', '父母繼承子女的事業', '子女可以自由選擇工作', '父母退休後去讀書'], '過去常期待子女接手家族的事業，例如家裡開店、務農就由子女繼承。'),
  C('d5', '現在許多父母對孩子未來職業的態度，比較接近哪一種？', ['尊重孩子的興趣與選擇，給予支持', '一定要孩子繼承家業', '完全不和孩子討論', '由父母決定一切'], '社會觀念改變，父母更重視孩子的興趣與適性發展，親子之間更常溝通討論。'),

  T('d5', '「晚輩一定要完全照長輩的話做，才叫孝順」是現代最普遍的觀念。', false, '現代社會仍重視孝順，但更強調親子間的尊重與溝通，而不是單方面服從。'),
  C('d5', '雙薪家庭越來越多，家事分工最合理的方式是什麼？', ['家庭成員依能力和時間共同分擔', '全部交給媽媽', '全部交給孩子', '都不要做'], '家事是全家人的事，大家一起分擔，才公平也才能減輕彼此的壓力。'),

  C('e1', '下列哪一個廣告內容最符合性別平等的觀念？', ['爸爸和媽媽一起下廚、照顧孩子', '只有媽媽在洗衣服', '只有爸爸能開車', '女生只能當秘書'], '呈現家務、工作不分性別的畫面，能打破刻板印象。'),

  C('e2', '依照法律，誰可以申請育嬰留職停薪？', ['符合條件的父親或母親都可以', '只有母親', '只有父親', '只有祖父母'], '育嬰留職停薪是父母雙方都可以申請的權利，鼓勵共同育兒。'),
  T('e2', '近年來申請育嬰留職停薪的父親人數逐漸增加。', true, '隨著觀念改變和津貼提高，越來越多父親願意請育嬰假，參與照顧孩子。'),
  C('e2', '公共場所設置「親子廁所」，主要的好處是什麼？', ['讓任何性別的家長都能方便帶孩子如廁', '讓廁所比較豪華', '只讓媽媽使用', '增加清潔人員'], '親子廁所設有大人和小孩的設備，讓爸爸、媽媽或其他照顧者都能方便帶孩子使用。'),
  C('e2', '「性別友善廁所」的設計目的是什麼？', ['讓不同性別、需要協助的人都能安心使用', '只給男生使用', '只給女生使用', '讓廁所變少'], '性別友善廁所讓所有人都能使用，也方便需要家人陪同的長輩或身障者。'),
  C('e2', '在職場遇到因為懷孕而被要求離職，可以怎麼做？', ['向勞工主管機關申訴，依法爭取權益', '只能接受', '在網路上罵公司', '偷偷搬走公司的東西'], '因懷孕而被迫離職違反性別平等工作法，可以向勞工局等主管機關申訴。'),

  C('e3', '清代女性的教育多以什麼為主？', ['家務、女紅等生活技能', '四書五經應考科舉', '外語和科學', '法律和政治'], '受傳統觀念影響，女性多在家中學習烹飪、刺繡、縫紉等家務技能。'),

  C('e3', '現在臺灣的大學生中，男女人數大致是什麼情況？', ['男女人數相當', '幾乎都是男生', '幾乎都是女生', '女生不能讀大學'], '教育普及後，女性接受高等教育的人數大幅增加，現在大學生的男女人數已相當接近。'),
  O('e3', '女性受教育機會的演進，依時間排排站！', ['清代以科舉教育為主，女性很少求學', '馬偕在淡水創辦女學堂', '日治時期設立高等女學校', '現在男女接受高等教育的人數相當'], '清代 → 1884 年淡水女學堂 → 日治時期高等女學校 → 現在男女受教育機會趨於平等。'),
  C('e3', '女性受教育的機會增加，對社會最重要的影響是什麼？', ['女性能發揮專長，參與各行各業與公共事務', '女性都不用工作', '男性不能再讀書', '家庭數量變少'], '教育讓女性擁有知識和能力，能投入職場、參與政治，提升社會整體的發展。'),
  // ===== e4 生活中的性別平等 =====
  C('e4', '下列哪一種家務分配最符合性別平等？', ['依每個人的時間和能力輪流分擔', '女生負責所有家事', '男生只負責修電器', '小孩都不用做'], '家務不應該依性別分配，而是依照每個人的時間和能力共同分擔。'),
  C('e4', '下列哪一個職業選擇的想法最恰當？', ['依自己的興趣和能力選擇', '男生只能當工程師', '女生只能當老師', '要看父母的性別'], '職業沒有性別之分，男性護理師、女性機師都很常見。'),
  T('e4', '男生當護理師、女生當消防員，都是很正常的職業選擇。', true, '只要有興趣和能力，任何人都可以選擇自己想要的工作。'),
  C('e4', '在學校遇到性騷擾，最恰當的處理方式是什麼？', ['告訴信任的師長，向學校提出申訴', '自己忍耐不說', '在網路上公開對方的個資', '以暴力報復'], '學校設有性別平等教育委員會處理申訴，應尋求師長協助，依程序保護自己。'),
  C('e4', '下列哪一個玩笑話，可能讓人感到不舒服，屬於性別歧視？', ['「你是女生，數學不好很正常。」', '「這題我們一起想想看。」', '「你的想法很有創意。」', '「謝謝你幫忙。」'], '用性別斷定一個人的能力，是貶低他人的歧視言論，即使是玩笑也可能傷人。'),
  T('e4', '運動社團應該限定性別，才能維持公平。', false, '社團和活動應對所有人開放；比賽分組另有規則，但參與的機會不應因性別而被剝奪。'),
  C('e4', '學校的球場時間，男生總是占用大部分場地，比較好的改善方式是什麼？', ['制定輪流使用的規則，讓大家都有機會', '只讓男生使用', '只讓女生使用', '把球場關閉'], '公共資源應公平分配，訂定輪流規則能讓每個人都有使用的機會。'),
  C('e4', '下列哪一句話，最能表達對性別平等的支持？', ['「每個人都能做自己喜歡的事。」', '「男主外、女主內。」', '「女生要文靜才可愛。」', '「男生不能怕。」'], '尊重每個人的選擇與特質，不用性別框住別人，就是支持性別平等。'),
  // ===== f1 原住民族的信仰與祭典 =====

  C('f1', '目前政府正式認定的臺灣原住民族有幾族？', ['16 族', '9 族', '10 族', '20 族'], '目前政府認定的原住民族共 16 族，最近一次增加的是 2014 年正名的拉阿魯哇族和卡那卡那富族。'),
  C('f1', '阿美族一年中最重要、慶祝豐收的祭典是什麼？', ['豐年祭', '飛魚祭', '打耳祭', '巴斯達隘'], '阿美族豐年祭通常在夏季舉行，感謝祖靈帶來豐收，族人一起歌舞。'),
  C('f1', '住在蘭嶼的達悟族，每年迎接飛魚季節的祭典是什麼？', ['飛魚祭', '豐年祭', '矮靈祭', '打耳祭'], '飛魚是達悟族重要的食物，每年春天舉行飛魚祭，祈求漁獲豐收。'),
  C('f1', '布農族祈求狩獵豐收、訓練男孩射箭的祭典是什麼？', ['打耳祭', '豐年祭', '飛魚祭', '媽祖遶境'], '打耳祭（射耳祭）是布農族重要的祭典，男孩練習射擊獸耳，祈求狩獵豐收。'),
  C('f1', '賽夏族每兩年舉行一次、紀念矮人的祭典叫做什麼？', ['巴斯達隘（矮靈祭）', '飛魚祭', '豐年祭', '燒王船'], '賽夏族的巴斯達隘是為了紀念傳說中的矮人，並提醒族人反省。'),
  T('f1', '原住民族的祭典和農耕、狩獵、捕魚等生活方式有密切關係。', true, '祭典常配合作物收成、狩獵或漁撈季節，反映了各族與自然共存的生活方式。'),
  C('f1', '原住民族的祭典，對族人有什麼重要意義？', ['凝聚族人、傳承文化與祖先的智慧', '只是表演給觀光客看', '為了賺錢', '沒有特別意義'], '祭典讓族人團聚，傳承語言、歌舞與傳統知識，也加強族群認同。'),
  T('f1', '參加原住民族祭典時，外人可以隨意闖入禁地拍照，不必遵守禁忌。', false, '祭典有許多神聖的儀式和禁忌，參與時應尊重族人的規定，不能任意干擾。'),
  // ===== f2 漢人的信仰 =====

  C('f2', '王爺信仰中有「燒王船」的儀式，主要是為了什麼？', ['送走瘟疫、祈求地方平安', '慶祝新年', '紀念戰爭', '祈求考試順利'], '王爺被認為能驅除瘟疫，燒王船象徵把瘟疫送走，保佑地方平安。'),
  C('f2', '屏東東港每三年舉行一次、以燒王船聞名的祭典是什麼？', ['東港迎王平安祭典', '豐年祭', '大甲媽祖遶境', '元宵燈會'], '東港迎王平安祭典規模盛大，最後的燒王船儀式吸引許多人參觀。'),
  C('f2', '每年農曆三月，臺中大甲有一項跨越多個縣市的盛大宗教活動，是什麼？', ['大甲媽祖遶境進香', '東港燒王船', '豐年祭', '飛魚祭'], '大甲媽祖遶境進香為期約九天八夜，行經多個縣市，是臺灣重要的宗教盛事。'),
  C('f2', '在早期的漢人聚落，廟宇除了拜拜，還有什麼功能？', ['居民聚會、商議公共事務的地方', '銀行', '醫院手術室', '軍事要塞'], '廟宇常是聚落的中心，居民在這裡聚會、調解糾紛、舉辦活動。'),
  C('f2', '漢人移民帶來的宗教，除了民間信仰，還包括哪些？', ['佛教和道教', '伊斯蘭教', '原住民族的祖靈信仰', '只有基督教'], '漢人移民帶來佛教、道教，以及媽祖、王爺、土地公等民間信仰。'),
  T('f2', '土地公在漢人信仰中，常被視為守護地方、保佑農作的神明。', true, '土地公（福德正神）守護一方土地，農民特別祈求祂保佑五穀豐收。'),
  C('f2', '鹿港龍山寺是哪一種宗教的寺廟？', ['佛教', '天主教', '伊斯蘭教', '原住民族祖靈信仰'], '龍山寺主祀觀世音菩薩，屬於佛教寺廟，也是重要的古蹟。'),
  // ===== f3 西方宗教的傳入 =====
  C('f3', '17 世紀在臺灣南部傳播基督新教的是哪一國人？', ['荷蘭人', '日本人', '英國人', '美國人'], '1624 年荷蘭人在臺南一帶建立據點，並向原住民傳播基督新教。'),
  C('f3', '17 世紀在臺灣北部傳播天主教的是哪一國人？', ['西班牙人', '荷蘭人', '日本人', '葡萄牙人'], '1626 年西班牙人占領基隆、淡水一帶，傳教士在北部傳播天主教。'),
  C('f3', '19 世紀臺灣開港通商後，在北部傳教、創辦學校和醫館的長老教會傳教士是誰？', ['馬偕', '馬雅各', '孫中山', '鄭成功'], '馬偕在淡水傳教，創辦了牛津學堂、女學堂和醫館，對北臺灣影響很大。'),
  C('f3', '19 世紀在臺灣南部行醫傳教的長老教會傳教士是誰？', ['馬雅各', '馬偕', '陳澄波', '林獻堂'], '馬雅各是英國長老教會傳教士，在臺南、高雄一帶行醫傳教。'),
  T('f3', '傳教士來臺除了傳教，也引進了西方的醫療和教育。', true, '傳教士創辦醫院、學校，帶來西式醫療與新式教育，對臺灣社會影響深遠。'),
  C('f3', '屏東的萬金聖母聖殿，是臺灣歷史悠久的哪一種宗教建築？', ['天主教堂', '佛教寺廟', '清真寺', '媽祖廟'], '萬金聖母聖殿建於 19 世紀，是臺灣現存歷史最悠久的天主教堂之一。'),
  C('f3', '西方宗教傳入時，有些教會把在地文化融入建築或儀式，主要目的是什麼？', ['拉近和當地居民的距離，讓人更容易接受', '嚇走當地居民', '把教堂改成廟', '收取門票'], '融入在地文化能減少隔閡，讓居民更願意認識新的宗教。'),
  O('f3', '西方宗教傳入臺灣的經過，依時間排排站！', ['荷蘭人在南部傳播基督新教', '西班牙人在北部傳播天主教', '開港後馬偕在淡水傳教'], '荷蘭人 1624 年來臺 → 西班牙人 1626 年來臺 → 19 世紀開港後馬偕傳教（1872 年抵淡水）。'),
  // ===== f4 伊斯蘭教與新住民 =====

  C('f4', '近年臺灣信仰伊斯蘭教的人數增加，主要和哪一群人有關？', ['來自印尼等國的移工和新住民', '荷蘭人', '日本人', '原住民族'], '印尼是穆斯林人口最多的國家，許多來臺工作或生活的印尼人信仰伊斯蘭教。'),
  C('f4', '餐廳提供「清真（Halal）」認證的食物，是為了尊重誰的飲食習慣？', ['伊斯蘭教徒', '佛教徒', '天主教徒', '道教徒'], '伊斯蘭教規定不能吃豬肉、不能喝酒等，清真認證確保食物符合教規。'),
  T('f4', '戰後隨中華民國政府來臺的人當中，也有一些伊斯蘭教徒。', true, '1949 年前後，有一些穆斯林隨政府來臺，後來在臺灣興建清真寺。'),
  C('f4', '伊斯蘭教徒每年有一個月在白天禁食，這個月叫什麼？', ['齋戒月', '鬼月', '國慶月', '畢業月'], '齋戒月期間，穆斯林從日出到日落不吃不喝，體會飢餓、培養自律。'),
  C('f4', '學校有信仰伊斯蘭教的同學，下列哪一種做法最能表現尊重？', ['了解並尊重他的飲食與禮拜習慣', '故意請他吃豬肉', '嘲笑他的服裝', '要求他改變信仰'], '尊重別人的宗教習慣，是多元社會中和睦相處的基礎。'),
  T('f4', '新住民帶來的文化和信仰，讓臺灣社會更加多元。', true, '新住民帶來不同的語言、飲食、節慶與信仰，豐富了臺灣的文化。'),

  C('f5', '信仰基督教的同學參觀廟宇時，不想拿香拜拜，最恰當的做法是什麼？', ['尊重自己的信仰，安靜參觀即可，不必勉強', '一定要跟著拿香', '大聲說廟宇不好', '偷偷離開不告訴老師'], '尊重是雙向的：不勉強別人違反自己的信仰，同時也要尊重參觀場所的規矩。'),

  T('f5', '參觀別人的宗教場所時，應該遵守該場所的規矩，例如脫鞋或保持安靜。', true, '各宗教場所有不同的規範，遵守規矩是對信仰者的基本尊重。'),
  T('f5', '如果自己不信某個宗教，就可以任意嘲笑它的儀式。', false, '不論是否認同，都應尊重他人的信仰，嘲笑是不尊重的行為。'),
  C('f5', '臺灣常見不同宗教的人一起參與社區活動，這反映了臺灣社會的什麼特色？', ['宗教多元、彼此包容', '只有一種宗教', '宗教被禁止', '大家都不信宗教'], '臺灣有民間信仰、佛教、道教、基督教、天主教、伊斯蘭教等，大多能和平共處。'),
  C('f5', '要減少不同宗教之間的誤會，最好的方法是什麼？', ['多認識、多了解彼此的信仰與文化', '互相不往來', '只聽一方說法', '禁止所有宗教活動'], '了解越多，誤會越少；透過交流與對話，能促進不同信仰的人彼此尊重。'),

  T('e1', '性別平等的社會中，每個人都可以依自己的興趣選擇穿著和才藝。', true, '穿著、才藝、興趣都是個人的選擇，不應因性別而被要求或被限制。'),
  C('e2', '學校如果發生性別相關的事件，主要由哪一個組織負責調查處理？', ['性別平等教育委員會', '家長會', '班聯會', '福利社'], '依性別平等教育法，學校要設立性別平等教育委員會，處理申訴並推動性平教育。'),
  C('e2', '同樣的工作、同樣的表現，雇主卻因為性別給予不同的薪水，這違反了什麼原則？', ['同工同酬', '比例原則', '依法行政', '主權在民'], '同工同酬是指從事相同工作、表現相同的人，應獲得相同的報酬，不因性別而有差別。'),

  T('e3', '清代的科舉考試，女性也可以報名參加。', false, '清代科舉只開放給男性，女性無法參加，這也是女性受教育機會少的原因之一。'),

      if (st.mt % 30 === 15) st.parts.push({ x:cx() + 8 * front, y:GY - PH - 2, vx:0, vy:.3, t:26, c:'#3ce0ff', sh:'drop' });
      if (st.mt <= 0) st.mode = 'walk';
    }
    st.x += speed * st.dir;
    if (st.x < 4){ st.x = 4; st.dir = 1; } if (st.x > W - S2 - 4){ st.x = W - S2 - 4; st.dir = -1; }
    // ---- 畫 ----
    g.imageSmoothingEnabled = false;
    g.save(); if (shake) g.translate(Math.round((Math.random() - .5) * shake * 2), 0);
    fP(g, -4, 0, '#141a3a', W + 8, H);
    for (let y = 0; y < GY; y += 4) fP(g, -4, y, `rgba(${rgb},${.04 + y / H * .22})`, W + 8, 4);
    stars.forEach(s => { if ((st.t + s.x) % 70 < 58) fP(g, s.x, s.y, s.k ? '#ffffff' : '#ffcf3f', 1, 1); });
    fP(g, -4, GY, '#2a3370', W + 8, H - GY); fP(g, -4, GY, color, W + 8, 1);
    for (let x = 0; x < W; x += 12) fP(g, x + 3, GY + 3, '#343e86', 5, 1);
    fP(g, Math.round(st.x + 4), GY - 1, 'rgba(0,0,0,.4)', S2 - 8, 2);
    if (bg) bg();
    g.save(); g.translate(Math.round(cx()), Math.round(GY - PH / 2 + h)); g.rotate(rot); g.scale(sx * (st.dir > 0 ? -1 : 1), sy);
    g.drawImage(img, -S2 / 2, -PH / 2, S2, PH); g.restore();
    if (fx) fx();
    st.parts = st.parts.filter(p => {
      p.x += p.vx; p.y += p.vy; if (p.sh === 'dot') p.vy += .08; if (p.sh === 'z'){ p.vy = -.25; p.vx = .15; } p.t--;
      if (p.sh === 'heart') heart(Math.round(p.x), Math.round(p.y), p.c);
      else if (p.sh === 'drop'){ fP(g, Math.round(p.x), Math.round(p.y), p.c, 2, 3); fP(g, Math.round(p.x), Math.round(p.y) - 1, p.c, 1, 1); }
      else if (p.sh === 'z') glyph('z', Math.round(p.x), Math.round(p.y));
      else fP(g, Math.round(p.x), Math.round(p.y), p.c, 2, 2);
      return p.t > 0;
    });
    g.restore();
    requestAnimationFrame(frame);
  }
  st.happy = () => { st.mode = 'happy'; st.mt = 0; st.mem = {}; st.T = (MOVES[S.pet] || ['', 130])[1]; st.pause = 0; pop(st.x + 14, GY - 26, '#ffcf3f', 8); };
  st.sad = () => { st.mode = 'sad'; st.mt = 90; st.mem = {}; };
  requestAnimationFrame(frame);
  return st;
}

// ---------- 出題：平均分配到每一個觀念（每個觀念先出比較少出過的題目） ----------
function pickEven(secs, n){
  const pools = shuffle(secs.slice()).map(sec => shuffle(BANK.filter(q => q.s === sec.id)).sort((a, b) => (S.seen[a.id] || 0) - (S.seen[b.id] || 0)));
  const out = [];
  while (out.length < n && pools.some(p => p.length)) for (const p of pools){ if (out.length >= n) break; const q = p.shift(); if (q) out.push(q); }
  return shuffle(out);
}
let Q = null;
function startMission(ti){
  const mix = ti === 'mix';

    const n = TOPICS.length, per = Math.floor(MISSION_LEN / n), extra = shuffle(TOPICS.map((_, i) => i)).slice(0, MISSION_LEN - per * n);
    list = shuffle(TOPICS.flatMap((tp, i) => pickEven(tp.secs, per + (extra.includes(i) ? 1 : 0))));
  } else list = pickEven(TOPICS[ti].secs, MISSION_LEN);
  const tp = mix ? { c:'var(--gold)', hex:'#ffcf3f', name:'綜合挑戰' } : TOPICS[ti];
  Q = { tp, ti, mix, list, i:0, res:[], combo:0, maxCombo:0, score:0, xp:0, newCards:[], lv0:lvOf(S.xp), t0:Date.now() };
  if (lbReady()) lbFetch().catch(() => {});   // 先讀排行榜，答完時就不用等
  SFX.blip();
  if (SCENE) SCENE.alive = false;
  $('view').innerHTML = `<div class="wrap" style="--c:${tp.c}">
    <div class="hud"><span class="uname">${mix ? '🎲 綜合挑戰' : `${esc(tp.name)}`}</span><div class="dots" id="dots"></div><span class="combo" id="combo"></span><span class="score" id="score">0</span></div>
    <div class="scene" id="scene"><canvas id="sceneCv" width="480" height="48" aria-hidden="true"></canvas></div>
    <div id="qbox"></div>

  question();
}

// ---------- 提示動畫：這個觀念的重點，一格一格出現，旁白一個字一個字跑出來 ----------
let HINT = null;
function openHint(q){
  if (Q && !Q.done) Q.hinted = true;
  SFX.page();
  const sec = q.sec;
  $('modal').innerHTML = `<div class="hintbox" role="dialog" aria-label="提示動畫">
    <div class="head"><span>💡 ${esc(sec.title)}</span><span class="px" id="hpg"></span></div>
    <canvas id="hintCv" width="320" height="150"></canvas>
    <div class="cap" id="hcap" aria-live="polite"></div>
    <div class="row"><button class="btn alt" id="hprev">◀ 上一格</button><button class="btn alt" id="hreplay">↻ 重播</button><button class="btn" id="hnext">下一格 ▶</button></div>
  </div>`;
  $('modal').hidden = false;
  HINT = { sec, tp:q.topic, k:0, t:0, alive:true };
  const go = k => { HINT.k = Math.max(0, Math.min(sec.hint.length - 1, k)); HINT.t = 0; SFX.page(); };
  $('hprev').onclick = () => go(HINT.k - 1);
  $('hreplay').onclick = () => go(0);
  $('hnext').onclick = () => HINT.k < sec.hint.length - 1 ? go(HINT.k + 1) : closeModal();
  hintLoop();
}
function hintLoop(){
  const H = HINT; if (!H || !H.alive || $('modal').hidden) return;
  const cv = $('hintCv'); if (!cv) return;
  const g = cv.getContext('2d'), W = cv.width, Hh = cv.height, [ic, cap] = H.sec.hint[H.k];
  H.t++;
  g.imageSmoothingEnabled = false;
  fP(g, 0, 0, '#0e1330', W, Hh);
  for (let x = 0; x < W; x += 20) fP(g, x, 0, '#121842', 10, Hh);
  fP(g, 0, Hh - 26, '#2a3370', W, 26); fP(g, 0, Hh - 26, H.tp.hex, W, 2);
  const toks = ic.split(' ').filter(Boolean), n = toks.length, gap = Math.min(64, (W - 60) / Math.max(1, n));
  toks.forEach((tk, i) => {
    const appear = H.t - i * 12; if (appear < 0) return;
    const s = appear < 10 ? .4 + appear / 10 * .8 : 1 + Math.max(0, .2 - (appear - 10) / 25), bob = Math.sin((H.t + i * 20) / 14) * 3;
    const cx = W / 2 + 12 + (i - (n - 1) / 2) * gap, cy = Hh / 2 - 6 + bob;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (tk === '➡️'){ g.fillStyle = '#ffcf3f'; g.font = 'bold 22px sans-serif'; g.fillText('▶', cx + Math.round((H.t / 4) % 8) - 4, cy); return; }
    if (/^[\d\/A-Za-z]+$/.test(tk)){ g.fillStyle = '#f4f1ff'; g.font = `bold ${tk.length > 2 ? 14 : 18}px "Press Start 2P", monospace`; g.fillText(tk, cx, cy); return; }
    const sz = Math.round(42 * Math.min(1.2, s));
    fP(g, Math.round(cx - 16), Hh - 30, 'rgba(0,0,0,.35)', 32, 4);
    g.drawImage(sprite(tk, 24), 0, 0, 24, 24, Math.round(cx - sz / 2), Math.round(cy - sz / 2), sz, sz);
  });
  // 小夥伴在角落點頭
  const PI = petImg(S.pet); g.drawImage(PI, 6, Hh - 26 - PI.height * 2 + Math.round(Math.abs(Math.sin(H.t / 8)) * -4), PI.width * 2, PI.height * 2);
  const shown = Math.min(cap.length, Math.max(0, Math.floor((H.t - 10) / 2)));
  const capEl = $('hcap'); if (capEl && capEl.dataset.n !== shown + '-' + H.k){ capEl.dataset.n = shown + '-' + H.k; capEl.textContent = cap.slice(0, shown) + (shown < cap.length ? '▌' : ''); if (shown && shown % 3 === 0 && shown < cap.length) beep(600 + (shown % 5) * 40, .02, 'square', .02); }
  $('hpg').textContent = `${H.k + 1} / ${H.sec.hint.length}`;
  $('hprev').disabled = H.k === 0;
  $('hnext').textContent = H.k < H.sec.hint.length - 1 ? '下一格 ▶' : '我懂了 ✔';
  requestAnimationFrame(hintLoop);
}

// ---------- 排行榜：存在 Firebase（Firestore），朋友之間一起比 ----------
// 四種排行：單次最高分、累積答對題數、20 題全對的最快時間、等級（用 XP 排，XP 越多等級越高）；每個人在每種排行只留最好的一筆
// Firebase 設定（Firestore 存排行、匿名登入讓每台裝置有自己的身分，只能改自己的成績）
const FB = { apiKey:'AIzaSyAGgWCP-bwO45c9pLpsFdH_42NeVgGSMrM', projectId:'edulab-6-social-rank' };
const LB_SHOW = 10;
const BOARDS = [
  { id:'score', name:'單次最高分', icon:'⭐', fmt:v => `${v} 分` },
  { id:'correct', name:'累積答對題數', icon:'✅', fmt:v => `${v} 題`, acc:true },
  { id:'time',  name:'全對最快',   icon:'⏱️', fmt:v => `${Number(v).toFixed(1)} 秒`, lower:true },
  { id:'lv',    name:'等級',       icon:'🎖️', fmt:v => `Lv.${lvOf(v)} ${titleOf(lvOf(v))}`, sub:v => `${v} XP`, acc:true }
];
const lbReady = () => /^AIza/.test(FB.apiKey) && FB.projectId && !FB.projectId.startsWith('__');
const myId = () => S.uid || S.pid || '';
const FS = () => `https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`;
// 匿名登入：第一次註冊一個匿名帳號，之後用 refresh token 換新的 id token（一小時有效）
let FB_TOKEN = null;
async function fbToken(){
  if (FB_TOKEN && FB_TOKEN.exp > Date.now() + 60000) return FB_TOKEN.id;
  let r, d;
  if (S.fbRefresh){
    r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB.apiKey}`, { method:'POST', headers:{ 'Content-Type':'application/x-www-form-urlencoded' }, body:`grant_type=refresh_token&refresh_token=${encodeURIComponent(S.fbRefresh)}` });
    if (r.ok){ d = await r.json(); FB_TOKEN = { id:d.id_token, exp:Date.now() + d.expires_in * 1000 }; S.uid = d.user_id; S.fbRefresh = d.refresh_token; save(); return FB_TOKEN.id; }
  }
  r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB.apiKey}`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ returnSecureToken:true }) });
  if (!r.ok) throw new Error('auth');
  d = await r.json();
  FB_TOKEN = { id:d.idToken, exp:Date.now() + d.expiresIn * 1000 }; S.uid = d.localId; S.fbRefresh = d.refreshToken; save();
  return FB_TOKEN.id;
}
const fsVal = v => v.integerValue != null ? Number(v.integerValue) : v.doubleValue != null ? Number(v.doubleValue) : v.stringValue != null ? v.stringValue : null;
// 讀一種排行的前 20 名
async function fbTop(b){
  const r = await fetch(`${FS()}:runQuery`, { method:'POST', headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify({ structuredQuery:{ from:[{ collectionId:'lb_' + b.id }], orderBy:[{ field:{ fieldPath:'value' }, direction:b.lower ? 'ASCENDING' : 'DESCENDING' }], limit:20 } }) });
  if (!r.ok) throw new Error('http');
  return (await r.json()).filter(x => x.document).map(x => { const f = x.document.fields; return { pid:x.document.name.split('/').pop(), name:fsVal(f.name), pet:fsVal(f.pet), value:fsVal(f.value) }; });
}
// 讀到的排行榜存在這台裝置，打開時先顯示上次的，背景再更新；同一時間只送一個請求；每一輪開始就先讀
const LB_CACHE = 'g6-lb-cache-fb';
let LBC = null, LB_INFLIGHT = null;
try { LBC = JSON.parse(localStorage.getItem(LB_CACHE) || 'null'); } catch (e){}
const lbRemember = data => { LBC = { at:Date.now(), data }; try { localStorage.setItem(LB_CACHE, JSON.stringify(LBC)); } catch (e){} return data; };
function lbFetch(){
  if (!lbReady()) return Promise.reject(new Error('nourl'));
  if (!LB_INFLIGHT){
    LB_INFLIGHT = Promise.all(BOARDS.map(fbTop))
      .then(ls => lbRemember(Object.fromEntries(BOARDS.map((b, i) => [b.id, ls[i]]))))
      .finally(() => { LB_INFLIGHT = null; });
  }
  return LB_INFLIGHT;
}
// 上傳成績：每種排行只在比自己舊紀錄好的時候更新分數；名字和小夥伴每次都更新
async function lbPost(entries, name){
  const tok = await fbToken(), uid = S.uid;
  await Promise.all(entries.map(async en => {
    const b = BOARDS.find(x => x.id === en.board), url = `${FS()}/lb_${b.id}/${uid}`;
    const old = await fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
    const oldV = old && old.fields ? fsVal(old.fields.value) : null;
    const isBetter = oldV == null || lbBetter(b, en.value, oldV);
    const fields = { name:{ stringValue:name }, pet:{ stringValue:S.pet } };
    if (isBetter) fields.value = b.lower ? { doubleValue:Number(en.value) } : { integerValue:String(Math.round(en.value)) };
    const mask = Object.keys(fields).map(k => `updateMask.fieldPaths=${k}`).join('&');
    const r = await fetch(`${url}?${mask}`, { method:'PATCH', headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${tok}` }, body:JSON.stringify({ fields }) });
    if (!r.ok) throw new Error('write ' + r.status);
  }));
  return lbFetch();
}
const lbBetter = (b, x, y) => b.lower ? x < y : x > y;
const lbOwnRank = list => { const i = (list || []).slice(0, LB_SHOW).findIndex(e => e.pid === myId()); return i < 0 ? null : i + 1; };
// 這個成績在排行榜上會是第幾名（進不了前 LB_SHOW 名、或沒有比自己的舊紀錄好，就回傳 null）
function lbRankOf(b, list, value){
  list = list || [];
  const own = list.find(e => e.pid === myId());
  if (own && !lbBetter(b, value, Number(own.value))) return null;
  const rank = list.filter(e => e.pid !== myId() && !lbBetter(b, value, Number(e.value))).length + 1;
  return rank <= LB_SHOW ? rank : null;
}
// 一輪結束後：看看能不能上排行榜，可以的話灑花、請他輸入名字
async function lbCheck(cands, since = 0){
  if (!lbReady()) return;
  // 這一輪開始時已經先讀過了就直接用，不用再等
  let data = LBC && LBC.at >= since ? LBC.data : null;
  if (!data){ try { data = await lbFetch(); } catch (e){ data = LBC && LBC.data; } }
  if (!data) return;
  const all = BOARDS.filter(b => cands[b.id] != null).map(b => ({ b, value:cands[b.id], rank:lbRankOf(b, data[b.id], cands[b.id]), was:lbOwnRank(data[b.id]) })).filter(w => w.rank);
  // 累積型的排行（答對題數、等級）每輪都會變多：已經在榜上、名次也沒往前的，就安靜地更新數字，不跳視窗
  const wins = all.filter(w => !w.b.acc || !w.was || w.rank < w.was);
  if (!wins.length){
    if (all.length && S.name) lbPost(all.map(w => ({ board:w.b.id, value:w.value })), S.name).catch(() => {});
    return;
  }
  confetti(); SFX.win();
  $('modal').innerHTML = `<div class="lbwin" role="dialog" aria-label="登上排行榜">
    <div class="head">🏆 恭喜！你可以登上排行榜！</div>
    <ul>${wins.map(w => `<li>${w.b.icon} ${w.b.name}：<b>${w.b.fmt(w.value)}</b><span class="rk">第 ${w.rank} 名</span></li>`).join('')}</ul>
    <label class="nm">輸入你的名字<input id="lbName" maxlength="12" autocomplete="nickname" placeholder="最多 12 個字" value="${esc(S.name || '')}"></label>
    <div class="me2"><canvas data-pc="${S.pet}"></canvas><span>會和你的小夥伴一起顯示在排行榜上</span></div>
    <p class="err" id="lbErr" hidden></p>
    <div class="row"><button class="btn" id="lbGo">🏆 登上排行榜</button><button class="btn alt" id="lbNo">先不要</button></div>
  </div>`;
  $('modal').hidden = false;
  paintPets($('modal'));
  setTimeout(() => $('lbName').focus(), 50);
  $('lbNo').onclick = closeModal;
  const go = async () => {
    const name = $('lbName').value.replace(/[<>]/g, '').trim().slice(0, 12);
    if (!name){ $('lbErr').hidden = false; $('lbErr').textContent = '請先輸入名字喔！'; return; }
    S.name = name; save();
    $('lbGo').disabled = true; $('lbGo').textContent = '上傳中…';
    try {
      const entries = all.map(w => ({ board:w.b.id, value:w.value }));
      const res = await lbPost(entries, name);
      showBoard(wins[0].b.id, res);
    } catch (e){ $('lbErr').hidden = false; $('lbErr').textContent = '連不上排行榜，請稍後再試一次。'; $('lbGo').disabled = false; $('lbGo').textContent = '🏆 再試一次'; }
  };
  $('lbGo').onclick = go;
  $('lbName').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}
// 排行榜視窗（四個分頁）
async function showBoard(tab = 'score', data = null){
  SFX.page();
  let updating = false;
  const paint = (msg) => {
    const b = BOARDS.find(x => x.id === tab), list = data ? (data[tab] || []).slice(0, LB_SHOW) : [];
    $('modal').innerHTML = `<div class="lbbox" role="dialog" aria-label="排行榜">
      <div class="head">🏆 排行榜<button class="x" data-close aria-label="關閉">✕</button></div>
      <div class="tabs">${BOARDS.map(x => `<button class="tab ${x.id === tab ? 'on' : ''}" data-tab="${x.id}">${x.icon} ${x.name}</button>`).join('')}</div>
      <div class="lbnote">${tab === 'time' ? '一輪 20 題全部答對，從開始到答完所花的時間' : tab === 'correct' ? '這台裝置累積答對的題數' : tab === 'lv' ? '這台裝置的等級，同一級的比 XP（經驗值）' : '一輪 20 題拿到的最高分數（含 COMBO 獎勵）'}</div>
      ${updating && !msg ? '<div class="lbupd">🔄 更新中…（先顯示上次讀到的排行）</div>' : ''}
      ${msg ? `<p class="lbmsg">${msg}</p>` : list.length ? `<ol class="lblist">${list.map((e, i) => `<li class="${e.pid === myId() ? 'me' : ''}"><span class="no">${['🥇', '🥈', '🥉'][i] || i + 1}</span><canvas data-pc="${esc(e.pet || 'dog')}"></canvas><span class="nm">${esc(e.name)}${e.pid === myId() ? '（你）' : ''}</span><span class="v">${b.fmt(e.value)}${b.sub ? `<small>${b.sub(e.value)}</small>` : ''}</span></li>`).join('')}</ol>` : '<p class="lbmsg">還沒有人上榜，快去挑戰吧！</p>'}
    </div>`;
    $('modal').hidden = false;
    paintPets($('modal'));
    $('modal').querySelectorAll('[data-tab]').forEach(t => t.onclick = () => { tab = t.dataset.tab; SFX.blip(); paint(); });
    $('modal').querySelector('[data-close]').onclick = closeModal;
  };
  if (!lbReady()){ paint('排行榜還沒有設定好（需要先設定 Firebase）。'); return; }
  if (data){ paint(); return; }
  const still = () => !$('modal').hidden && $('modal').querySelector('.lbbox');
  if (LBC){ data = LBC.data; updating = true; paint(); } else paint('讀取中…（第一次可能要等一下）');
  try { data = await lbFetch(); updating = false; if (still()) paint(); }
  catch (e){ updating = false; if (still()) paint(LBC ? '' : '連不上排行榜，請檢查網路後再試一次。'); }
}
// 灑花
function confetti(){
  const cv = document.createElement('canvas'); cv.className = 'confetti'; cv.width = innerWidth; cv.height = innerHeight;
  document.body.appendChild(cv);
  const g = cv.getContext('2d'), cols = ['#ffcf3f', '#ff5fa2', '#3ce0ff', '#3ccf6e', '#c48bff', '#ff6b6b'];
  const ps = Array.from({ length:160 }, () => ({ x:Math.random() * cv.width, y:-Math.random() * cv.height * .5, vx:(Math.random() - .5) * 2, vy:2 + Math.random() * 3, s:4 + Math.random() * 6, c:cols[Math.floor(Math.random() * cols.length)], r:Math.random() * 6, vr:(Math.random() - .5) * .3 }));
  let t = 0;
  (function step(){
    t++; g.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx + Math.sin((t + p.r * 20) / 20); p.y += p.vy; p.r += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); });
    if (t < 220) requestAnimationFrame(step); else cv.remove();
  })();
}

$('view').addEventListener('click', e => {
  audio();
  const ps = e.target.closest('[data-pscroll]');
  if (ps){ const row = $('petRow'); row.scrollBy({ left:+ps.dataset.pscroll * Math.max(80, row.clientWidth * .7), behavior:'smooth' }); SFX.blip(); return; }
  const pt = e.target.closest('[data-pet]');
  if (pt){ S.pet = pt.dataset.pet; save(); SFX.blip(); $('view').querySelectorAll('[data-pet]').forEach(b => { const on = b === pt; b.classList.toggle('on', on); b.setAttribute('aria-checked', String(on)); }); if (SCENE){ SCENE.alive = false; SCENE = startScene($('heroCv'), '#3ce0ff', 40); SCENE.happy(); } return; }
  if (e.target.closest('[data-mix]')){ startMission('mix'); return; }
  const un = e.target.closest('[data-unit]'); if (un){ startMission(+un.dataset.unit); return; }
  if (!Q || Q.done) return;
  const q = Q.list[Q.i];
  const op = e.target.closest('[data-a]');
  if (op){
    const a = +op.dataset.a, isRight = v => q.type === 'tf' ? (v === 1) === q.a : v === 0, ok = isRight(a);
    $('qbox').querySelectorAll('[data-a]').forEach(b => { b.disabled = true; const v = +b.dataset.a; if (isRight(v)) b.classList.add('ok'); else if (b === op) b.classList.add('no'); else b.classList.add('dim'); });
    answer(ok); return;
  }
  const oc = e.target.closest('[data-o]');
  if (oc){
    Q.picked.push(+oc.dataset.o); SFX.blip(); drawOrder();
    if (Q.picked.length === q.items.length){
      const ok = Q.picked.every((k, n) => k === n);
      $('line').querySelectorAll('.chipq').forEach((c, n) => c.classList.add(Q.picked[n] === n ? 'ok' : 'no'));
      answer(ok);
    }
    return;
  }
  if (e.target.closest('#undo')){ Q.picked.pop(); SFX.blip(); drawOrder(); }
});
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
addEventListener('keydown', e => {
  if (!$('modal').hidden){ if (e.key === 'Escape') closeModal(); if (HINT && HINT.alive && e.key === 'ArrowRight') $('hnext').click(); if (HINT && HINT.alive && e.key === 'ArrowLeft') $('hprev').click(); return; }

});
